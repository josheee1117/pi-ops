# Opt-in only: secrets stay in gitignored .env files; existing local data is untouched.
services:
  jdk17-drill:
    build: ./jdk17-drill
    container_name: pi-ops-jdk17-drill
    cpus: 2
    mem_limit: 512m
    environment:
      PI_OPS_ENDPOINT: http://pi-ops:8080
      PI_OPS_INGEST_TOKEN: local-ingest-token
      CPU_THRESHOLD: ${CPU_THRESHOLD:-0.01}
    ports:
      - "18089:8088"

  pi-ops-node-agent:
    environment:
      PI_OPS_ALLOWED_CONTAINERS: pi-ops-jdk17-drill
      PI_OPS_DOCKER_REPLAY_LOOKBACK_SECONDS: "1"
      PI_OPS_HEALTH_TARGETS: '[{"name":"dataasset-jdk17-local-本地演练","url":"http://jdk17-drill:8088/health","container":"pi-ops-jdk17-drill","intervalMs":2000}]'

  pi-runtime:
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PI_OPS_REQUIRE_REAL_MODEL: "1"
      PI_OPS_PI_MODEL: ${PI_OPS_JDK17_MODEL:-gpt-5.6-sol}
      PI_OPS_PI_THINKING_LEVEL: "off"
      PI_OPS_PI_RUNTIME_EXECUTION_TIMEOUT_MS: "300000"
      PI_OPS_PI_RUNTIME_MAX_CONTEXT_BYTES: "65536"
    volumes: !override
      - ./data/jdk17/${PI_OPS_JDK17_RUN_ID:-default}/pi-runtime:/data/pi-runtime
      - ./.env.jdk17-models.json:/root/.pi/agent/models.json:ro

  pi-ops:
    env_file:
      - .env.jdk17
    environment:
      PI_OPS_NOTIFICATION_WEBHOOK_URL: ${PI_OPS_NOTIFICATION_WEBHOOK_URL:?Set in gitignored deploy/local/.env.jdk17}
      PI_OPS_NOTIFICATION_WEBHOOK_KIND: wecom
      PI_OPS_NOTIFICATION_TIMEOUT_MS: "10000"
      PI_OPS_REASONING_MAX_CONTEXT_BYTES: "65536"
    volumes: !override
      - ./data/jdk17/${PI_OPS_JDK17_RUN_ID:-default}/pi-ops:/data/pi-ops
