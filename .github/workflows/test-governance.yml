name: Test Governance Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native dependencies
        run: pnpm rebuild better-sqlite3

      - name: Resolve evidence range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="$HEAD_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            base="$(git rev-parse HEAD~1)"
          else
            echo "No valid non-empty comparison base is available" >&2
            exit 1
          fi
          git cat-file -e "$base^{commit}"
          git cat-file -e "$head^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Run deterministic Test Governance Gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/test-governance-gate.json"
          set +e
          node tools/test-governance/src/cli.mjs gate \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --max-gate 3 \
            --json > "$result"
          code=$?
          set -e
          cat "$result"

          if [[ "$code" -eq 0 ]]; then
            exit 0
          fi

          status="$(node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(r.status || "INTERNAL_ERROR"));' "$result")"

          # The ordinary HEAD-side gate detects governance changes but is not
          # the authorization boundary. On pull requests only, defer the exact
          # review-required state to the BASE-controlled Governance Trust Anchor.
          # Every real gate failure remains non-zero, and direct pushes never get
          # this delegation path.
          if [[ "$EVENT_NAME" == "pull_request" && "$status" == "GOVERNANCE_REVIEW_REQUIRED" ]]; then
            echo "::notice::GOVERNANCE_REVIEW_REQUIRED deferred to authoritative Governance Trust Anchor"
            exit 0
          fi

          exit "$code"

      - name: Upload Test Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-evidence/**
          if-no-files-found: warn
          retention-days: 14
